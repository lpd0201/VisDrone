# Ultralytics YOLO11-style model config
# Backbone: C3k2WAR + FDM down-sampling | Neck: top-down FPN + bottom-up PAN | Head: FEM + Detect (P2, P3, P4)
# Custom modules (must be registered in ultralytics/nn/tasks.py): C3k2WAR, FDM, FEM

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants: [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# Backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2   (Conv 3x3)
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4   (Conv 3x3)  -> 160x160
  - [-1, 2, C3k2WAR, [256, False, 0.25]] # 2         C3k2WAR 160
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8   Conv        -> 80x80
  - [-1, 2, C3k2WAR, [512, False, 0.25]] # 4         C3k2WAR 80
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16  Conv        -> 40x40
  - [-1, 2, C3k2WAR, [512, True]] # 6         C3k2WAR 40
  - [-1, 1, FDM, [1024]] # 7-P5/32  FDM (down-sample) -> 20x20
  - [-1, 2, C3k2WAR, [1024, True]] # 8         C3k2WAR 20
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# Head
head:
  # ---- Top-down path ----
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11  20 -> 40
  - [[-1, 6], 1, Concat, [1]] # 12  cat C3k2WAR(40)
  - [-1, 2, C3k2, [512, False]] # 13  C3k2 (40)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14  40 -> 80
  - [[-1, 4], 1, Concat, [1]] # 15  cat C3k2WAR(80)
  - [-1, 2, C3k2, [256, False]] # 16  C3k2 (80)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17  80 -> 160
  - [[-1, 2], 1, Concat, [1]] # 18  cat C3k2WAR(160)
  - [-1, 2, C3k2, [128, False]] # 19  C3k2 (160)
  - [19, 1, FEM, [128]] # 20  FEM -> P2 output

  # ---- Bottom-up path ----
  - [19, 1, Conv, [128, 3, 2]] # 21  160 -> 80
  - [[-1, 16], 1, Concat, [1]] # 22  cat C3k2 (80)
  - [-1, 2, C3k2, [256, False]] # 23  C3k2 (80)
  - [23, 1, FEM, [256]] # 24  FEM -> P3 output

  - [23, 1, Conv, [256, 3, 2]] # 25  80 -> 40
  - [[-1, 13], 1, Concat, [1]] # 26  cat C3k2 (40)
  - [-1, 2, C3k2, [512, False]] # 27  C3k2 (40)
  - [27, 1, FEM, [512]] # 28  FEM -> P4 output

  # ---- Detect ----
  - [[20, 24, 28], 1, Detect, [nc]] # 29  Detect(P2, P3, P4)